<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interaktives Waagemodell</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#f3f6fb,#111827);--panel:light-dark(#fff,#1d2636);--ink:light-dark(#172a43,#edf3fc);--muted:light-dark(#65758b,#a9b7cb);--line:light-dark(#dbe3ee,#38465b);--blue:light-dark(#2678d4,#5aa6ff);--gold:#e6bd78}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}#app{min-height:100vh;width:100%;background:var(--bg);padding:clamp(14px,3vw,32px);border-radius:0}.top{max-width:1050px;margin:0 auto 14px;display:flex;justify-content:flex-end}.reset{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:10px 15px;font:inherit;font-weight:650;cursor:pointer}.stage{max-width:1050px;margin:auto}.scale-card{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:clamp(8px,2vw,22px);box-shadow:0 12px 36px #13243b0b}.equation-display{font-size:clamp(1.25rem,3vw,1.8rem);font-weight:800;text-align:center;padding:8px 12px 14px;color:var(--ink);min-height:48px}.scale{display:block;width:100%;height:auto;max-height:420px}.beam{transform-origin:400px 76px;transition:transform .38s cubic-bezier(.2,.7,.25,1)}.pan{transition:transform .38s cubic-bezier(.2,.7,.25,1)}.controls{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}.side{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:clamp(14px,2vw,22px);min-width:0}.side h2{font-size:1.15rem;margin:0 0 18px;display:flex;justify-content:space-between;align-items:center}.rows{display:grid;gap:12px}.item{display:grid;grid-template-columns:40px minmax(70px,1fr) 38px 30px 38px;align-items:center;gap:8px}.iconbox{width:36px;height:36px;display:grid;place-items:center}.package{width:31px;height:31px;display:grid;place-items:center;background:#f1d4a4;border:2px solid #a97a3e;border-radius:7px;color:#4b3219;font-weight:850}.ball{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#9ad6ff,#2784df 58%,#15559a);border:2px solid #1b64a7}.label{color:var(--muted);font-size:.95rem}.count{text-align:center;font-weight:750;font-variant-numeric:tabular-nums}.step{height:38px;width:38px;border-radius:11px;border:1px solid var(--line);color:var(--ink);background:var(--bg);font-size:1.3rem;cursor:pointer;display:grid;place-items:center}.step:hover:not(:disabled){border-color:var(--blue);background:color-mix(in srgb,var(--blue) 10%,var(--bg))}.step:disabled{opacity:.28;cursor:not-allowed}.reset:active,.step:active{transform:scale(.96)}.extra-task-area{max-width:1050px;margin:12px auto 0;display:flex;flex-direction:column;align-items:flex-end;gap:10px}.extra-task-button{background:#c62828;color:#fff;border:1px solid #a51d1d;border-radius:12px;padding:11px 16px;font:inherit;font-weight:750;cursor:pointer}.extra-task-button:hover{background:#a91f1f}.extra-task-panel{width:min(100%,700px);background:#ffebee;border:2px solid #c62828;border-radius:14px;padding:15px 17px;color:#7f1717;line-height:1.35;font-size:.8rem}.extra-task-panel h3{margin:0 0 8px;color:#b71c1c;font-size:.95rem}.extra-task-panel p{margin:6px 0}.extra-task-panel strong{font-weight:800}@media(max-width:680px){.controls{grid-template-columns:1fr}.scale{max-height:280px}.side{padding:15px}.item{grid-template-columns:36px minmax(65px,1fr) 36px 26px 36px;gap:6px}}
</style></head><body><div id="app"><div class="top"><button class="reset" id="reset">↺ Zurücksetzen</button></div><main class="stage"><section class="scale-card" aria-label="Waage"><svg class="scale" viewBox="0 0 800 340" role="img" aria-label="Waage mit zwei Waagschalen"><defs><linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b6c3d1"/><stop offset="1" stop-color="#64748b"/></linearGradient><linearGradient id="tray" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e2eaf2"/><stop offset="1" stop-color="#a9bacb"/></linearGradient></defs><ellipse cx="400" cy="310" rx="145" ry="10" fill="#718096" opacity=".14"/><path d="M365 306 L383 92 L417 92 L435 306Z" fill="url(#metal)" stroke="#536174" stroke-width="2"/><path d="M328 306 Q400 292 472 306 L488 320 L312 320Z" fill="url(#metal)" stroke="#536174" stroke-width="2"/><g id="beam" class="beam"><rect x="105" y="68" width="590" height="16" rx="8" fill="url(#metal)" stroke="#536174" stroke-width="2"/><circle cx="400" cy="76" r="23" fill="#8292a5" stroke="#536174" stroke-width="3"/><circle cx="400" cy="76" r="9" fill="#e5edf5" stroke="#536174" stroke-width="2"/></g><g id="left-pan" class="pan"><path d="M110 80 L65 200 M110 80 L225 200" stroke="#7b899a" stroke-width="3" fill="none"/><path d="M65 200 L225 200 Q217 222 202 226 L88 226 Q73 222 65 200Z" fill="url(#tray)" stroke="#68788a" stroke-width="2"/><g id="left-items"></g></g><g id="right-pan" class="pan"><path d="M690 80 L575 200 M690 80 L735 200" stroke="#7b899a" stroke-width="3" fill="none"/><path d="M575 200 L735 200 Q727 222 712 226 L598 226 Q583 222 575 200Z" fill="url(#tray)" stroke="#68788a" stroke-width="2"/><g id="right-items"></g></g><circle cx="110" cy="80" r="5" fill="#9aa9ba" stroke="#68788a" stroke-width="2"/><circle cx="690" cy="80" r="5" fill="#9aa9ba" stroke="#68788a" stroke-width="2"/></svg></section><section class="controls" aria-label="Objekte auf der Waage einstellen"><article class="side"><h2>← Linke Seite</h2><div class="rows"><div class="item"><span class="iconbox"><span class="package">x</span></span><span class="label">Pakete (x)</span><button class="step" data-side="left" data-kind="x" data-delta="-1" aria-label="Paket links entfernen">−</button><span class="count" id="left-x">2</span><button class="step" data-side="left" data-kind="x" data-delta="1" aria-label="Paket links hinzufügen">+</button></div><div class="item"><span class="iconbox"><span class="ball"></span></span><span class="label">Kugeln (1)</span><button class="step" data-side="left" data-kind="n" data-delta="-1" aria-label="Kugel links entfernen">−</button><span class="count" id="left-n">3</span><button class="step" data-side="left" data-kind="n" data-delta="1" aria-label="Kugel links hinzufügen">+</button></div></div></article><article class="side"><h2>Rechte Seite →</h2><div class="rows"><div class="item"><span class="iconbox"><span class="package">x</span></span><span class="label">Pakete (x)</span><button class="step" data-side="right" data-kind="x" data-delta="-1" aria-label="Paket rechts entfernen">−</button><span class="count" id="right-x">2</span><button class="step" data-side="right" data-kind="x" data-delta="1" aria-label="Paket rechts hinzufügen">+</button></div><div class="item"><span class="iconbox"><span class="ball"></span></span><span class="label">Kugeln (1)</span><button class="step" data-side="right" data-kind="n" data-delta="-1" aria-label="Kugel rechts entfernen">−</button><span class="count" id="right-n">3</span><button class="step" data-side="right" data-kind="n" data-delta="1" aria-label="Kugel rechts hinzufügen">+</button></div></div></article></section><section class="equation-tools"><button class="action" id="set-equation">Gleichung aufstellen</button><button class="action" id="solve-equation" disabled>Gleichung lösen</button><div id="equation-output" hidden aria-live="polite"></div></section></main></div><script>
const maxCount=18,initial={left:{x:2,n:3},right:{x:2,n:3}};let base=copy(initial),draft=copy(initial),applied=copy(initial),started=false,solution=null,solutionNumerator=0,solutionDenominator=1;
function copy(o){return JSON.parse(JSON.stringify(o))}
const ns='http://www.w3.org/2000/svg',out=document.getElementById('equation-output'),startBtn=document.getElementById('set-equation'),oldSolve=document.getElementById('solve-equation');
startBtn.textContent='Ausgangsgleichung aufstellen';oldSolve.remove();
const tools=document.querySelector('.equation-tools');tools.style.cssText='display:flex;flex-direction:column;gap:10px;margin-top:18px;align-items:stretch';
const actionRow=document.createElement('div');actionRow.style.cssText='display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap';tools.insertBefore(actionRow,startBtn);actionRow.appendChild(startBtn);
const extraArea=document.createElement('section');extraArea.className='extra-task-area';extraArea.style.cssText='max-width:none;margin:0;display:contents';extraArea.innerHTML='<button type="button" class="extra-task-button" id="extra-task-toggle" aria-expanded="false">Zusatzaufgabe anzeigen</button><div class="extra-task-panel" id="extra-task-panel" hidden><h3>Vertiefe deine Erkenntnisse:</h3><p><strong>(1)</strong> <strong>Verdopple</strong> die Anzahl aller Pakete und Kugeln auf beiden Seiten der Waage. Beschreibe, was mit der Waage geschieht, und notiere die neue Situation in der Tabelle (grafisch und symbolisch).</p><p><strong>(2)</strong> <strong>Halbiere</strong> anschließend wieder alle Pakete und Kugeln auf beiden Seiten. Vergleiche die Gleichung mit der Ausgangsgleichung.</p><p><strong>(3) Untersuche</strong> weitere Veränderungen dieser Art, zum Beispiel verdreifachen oder dritteln. Notiere, in welchen Fällen das Gleichgewicht erhalten bleibt.</p></div>';const extraToggle=extraArea.querySelector('#extra-task-toggle'),extraPanel=extraArea.querySelector('#extra-task-panel');actionRow.appendChild(extraToggle);extraToggle.addEventListener('click',()=>{const show=extraPanel.hidden;extraPanel.hidden=!show;extraToggle.setAttribute('aria-expanded',String(show));extraToggle.textContent=show?'Zusatzaufgabe ausblenden':'Zusatzaufgabe anzeigen'});
const style=document.createElement('style');style.textContent='.action{border:1px solid var(--line);background:var(--blue);color:white;border-radius:12px;padding:11px 16px;font:inherit;font-weight:700;cursor:pointer}.action:disabled{opacity:.35;cursor:not-allowed}#equation-output{font-size:1.12rem;font-weight:700;padding:12px 15px;border-radius:12px;background:var(--panel);border:1px solid var(--line);width:100%}.ghost{opacity:.3;stroke-dasharray:4 3!important}.beam,.pan{transition:none!important}';document.head.appendChild(style);
const applyBtn=document.createElement('button');applyBtn.className='action';applyBtn.id='apply-changes';applyBtn.textContent='Änderungen vornehmen';applyBtn.disabled=true;
const backBtn=document.createElement('button');backBtn.className='action';backBtn.id='back-base';backBtn.textContent='Zurück zur Ausgangsgleichung';backBtn.disabled=true;
tools.insertBefore(applyBtn,out);tools.insertBefore(backBtn,out);
tools.insertBefore(extraPanel,applyBtn);
const svg=document.querySelector('.scale'),mechanism=document.createElementNS(ns,'g');mechanism.setAttribute('id','moving-mechanism');const moving=[document.getElementById('beam'),document.getElementById('left-pan'),document.getElementById('right-pan'),...svg.querySelectorAll(':scope > circle')];svg.insertBefore(mechanism,moving[0]);moving.forEach(el=>mechanism.appendChild(el));
const equationDisplay=document.createElement('div');equationDisplay.className='equation-display';equationDisplay.textContent='';equationDisplay.hidden=true;equationDisplay.style.cssText='font-size:clamp(1.25rem,3vw,1.8rem);font-weight:800;text-align:center;padding:8px 12px 14px;color:var(--ink);min-height:48px';svg.parentElement.insertBefore(equationDisplay,svg);
function formatSide(s){const terms=[];if(s.x)terms.push(s.x===1?'x':s.x+'x');if(s.n)terms.push(String(s.n));return terms.join(' + ')||'0'}
function addSvg(group,kind,x,y,ghost=false){let el;if(kind==='x'){el=document.createElementNS(ns,'rect');Object.entries({x:x-9,y:y-10,width:18,height:20,rx:3,fill:ghost?'#f1d4a4':'#f1d4a4',stroke:'#a97a3e','stroke-width':1.5}).forEach(([k,v])=>el.setAttribute(k,v));group.appendChild(el);if(!ghost){const t=document.createElementNS(ns,'text');Object.entries({x,y:y+4,'text-anchor':'middle','font-size':12,'font-weight':800,fill:'#4b3219'}).forEach(([k,v])=>t.setAttribute(k,v));t.textContent='x';group.appendChild(t)}}else{el=document.createElementNS(ns,'circle');Object.entries({cx:x,cy:y,r:9,fill:ghost?'#2784df':'#2784df',stroke:'#15599a','stroke-width':1.6}).forEach(([k,v])=>el.setAttribute(k,v));group.appendChild(el)}if(ghost){el.classList.add('ghost');el.setAttribute('opacity','.3')}}
function drawSide(side){const group=document.getElementById(side+'-items');group.replaceChildren();const shown=applied[side],target=draft[side],center=side==='left'?145:655;const drawAt=(kind,index,ghost)=>{const x=center+(kind==='x'?-25:25)+(index%2)*18;const y=187-Math.floor(index/2)*23;addSvg(group,kind,x,y,ghost)};for(const kind of ['x','n']){const common=Math.min(shown[kind],target[kind]);for(let i=0;i<common;i++)drawAt(kind,i,false);for(let i=common;i<target[kind];i++)drawAt(kind,i,true);for(let i=common;i<shown[kind];i++)drawAt(kind,i,true)}}
function render(){for(const side of ['left','right']){for(const k of ['x','n'])document.getElementById(side+'-'+k).textContent=draft[side][k];drawSide(side)}const diffNumerator=started?(applied.left.x*solutionNumerator+applied.left.n*solutionDenominator-(applied.right.x*solutionNumerator+applied.right.n*solutionDenominator)):0,angle=diffNumerator===0?0:diffNumerator>0?-7:7;mechanism.setAttribute('transform','rotate('+angle+' 400 76)');document.querySelectorAll('.step').forEach(b=>{const v=draft[b.dataset.side][b.dataset.kind];b.disabled=(b.dataset.delta==='-1'&&v===0)||(b.dataset.delta==='1'&&v>=maxCount)});applyBtn.disabled=!started||JSON.stringify(draft)===JSON.stringify(applied);backBtn.disabled=!started;startBtn.disabled=started}
document.querySelectorAll('.step').forEach(b=>b.addEventListener('click',()=>{const s=draft[b.dataset.side];s[b.dataset.kind]=Math.max(0,Math.min(maxCount,s[b.dataset.kind]+Number(b.dataset.delta)));render()}));
startBtn.addEventListener('click',()=>{base=copy(draft);applied=copy(base);solutionNumerator=base.right.n-base.left.n;solutionDenominator=base.left.x-base.right.x;if(solutionDenominator<0){solutionNumerator=-solutionNumerator;solutionDenominator=-solutionDenominator}if(solutionDenominator===0){solutionNumerator=0;solutionDenominator=1}solution=solutionNumerator/solutionDenominator;started=true;out.hidden=true;out.textContent='';render()});
startBtn.addEventListener('click',()=>{equationDisplay.textContent=formatSide(base.left)+' = '+formatSide(base.right);equationDisplay.hidden=false});
applyBtn.addEventListener('click',()=>{if(started){applied=copy(draft);render()}});
backBtn.addEventListener('click',()=>{draft=copy(base);applied=copy(base);out.hidden=true;out.textContent='';render()});
document.getElementById('reset').addEventListener('click',()=>{base=copy(initial);draft=copy(initial);applied=copy(initial);started=false;solution=null;out.hidden=true;out.textContent='';equationDisplay.textContent='';equationDisplay.hidden=true;render()});render();
</script></body></html>
